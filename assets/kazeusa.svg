<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="320"
  viewBox="0 0 900 240"
  fill="none"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Kazeusa — 折纸兔与咖啡</title>
  <desc id="desc">
    KAZEUSA 几何折纸风字标，近黑字形配天蓝色与咖啡棕折面。
    右侧为带不对称折纸兔耳的咖啡杯，杯身有简洁兔脸，
    配以几何杯把、杯碟、风切线和咖啡豆。
  </desc>

  <g transform="translate(65 76)">
    <!-- 风的轨迹 -->
    <g id="wind">
      <path d="M-29 23 37 8 24 21Z" fill="#38BDF8"/>
      <path d="M-22 36 5 30 5 34Z" fill="#171B22"/>
    </g>

    <!-- K -->
    <g id="letter-k">
      <path d="M0 10 17 0V88H0Z" fill="#171B22"/>
      <path
        d="M18 39 45 0H65L34 44 68 88H47L18 51Z"
        fill="#171B22"
      />
      <path d="M34 44 68 88H47L24 57Z" fill="#38BDF8"/>
      <path d="M34 44 47 88 24 57Z" fill="#0284C7"/>
    </g>

    <!-- A -->
    <g id="letter-a-first" transform="translate(77)">
      <path
        fill-rule="evenodd"
        d="M0 88 23 0H43L66 88H49L44 68H22L17 88ZM26 52H40L33 22Z"
        fill="#171B22"
      />
      <path d="M23 0H43L48 19 33 12Z" fill="#B98256"/>
      <path d="M33 12 48 19 43 0Z" fill="#70452F"/>
    </g>

    <!-- Z -->
    <g id="letter-z" transform="translate(152)">
      <path
        d="M0 0H66V13L22 72H66V88H0V74L44 16H0Z"
        fill="#171B22"
      />
      <path d="M0 0H66L54 16H0Z" fill="#38BDF8"/>
      <path d="M54 16 66 0V13L47 38Z" fill="#0284C7"/>
    </g>

    <!-- E -->
    <g id="letter-e" transform="translate(227)">
      <path
        d="M0 0H64L52 16H17V35H53L42 51H17V72H64L52 88H0Z"
        fill="#171B22"
      />
      <path d="M17 35H53L42 51H17Z" fill="#B98256"/>
      <path d="M17 35H53L42 41Z" fill="#D9AB7E"/>
    </g>

    <!-- U -->
    <g id="letter-u" transform="translate(300)">
      <path
        d="M0 0H17V63L25 72H41L49 63V0H66V70L49 88H17L0 70Z"
        fill="#171B22"
      />
      <path d="M49 0H66V70L49 88V63Z" fill="#38BDF8"/>
      <path d="M66 30V70L49 88V63Z" fill="#0284C7"/>
      <path d="M49 0H66V21L49 12Z" fill="#7DD3FC"/>
    </g>

    <!-- S -->
    <g id="letter-s" transform="translate(375)">
      <path
        d="M17 0H66L54 16H24L17 23V32L24 37H49L66 54V71L49 88H0L12 72H42L49 65V59L42 53H17L0 36V17Z"
        fill="#171B22"
      />
      <path d="M24 37H49L66 54V71L49 59 42 53Z" fill="#B98256"/>
      <path d="M24 37 49 45 66 71 49 59 42 53Z" fill="#70452F"/>
    </g>

    <!-- A -->
    <g id="letter-a-last" transform="translate(450)">
      <path
        fill-rule="evenodd"
        d="M0 88 23 0H43L66 88H49L44 68H22L17 88ZM26 52H40L33 22Z"
        fill="#171B22"
      />
      <path d="M43 0 66 88H49L40 52 33 22Z" fill="#38BDF8"/>
      <path d="M43 0 49 88 40 52 33 22Z" fill="#0284C7"/>
      <path d="M43 0 54 42 41 26Z" fill="#7DD3FC"/>
    </g>

    <!-- 几何咖啡豆：以浅色折线形成豆缝 -->
    <g id="coffee-bean" transform="translate(5 115)">
      <path
        d="M0 9 8 0 23 2 30 12 22 23 8 22Z"
        fill="#70452F"
      />
      <path d="M8 0 23 2 16 10 0 9Z" fill="#B98256"/>
      <path d="M21 3 13 10 17 15 9 21 12 13 9 9Z" fill="#E8C9A5"/>
    </g>

    <!-- 字标下的风切线 -->
    <g id="wind-underline">
      <path d="M50 122H292L269 128H38Z" fill="#38BDF8"/>
      <path d="M310 122H412L397 126H301Z" fill="#B98256"/>
    </g>

    <!-- 折纸兔耳咖啡杯 -->
    <g id="origami-rabbit-cup" transform="translate(567 -4)">
      <!-- 左耳：直立，外侧深色折边 -->
      <path
        d="M28 37 14 -37 25 -48 43 -31 54 37Z"
        fill="#171B22"
      />
      <path
        d="M33 33 22 -34 26 -39 36 -28 47 33Z"
        fill="#38BDF8"
      />
      <path d="M26 -39 36 -28 47 33 38 8Z" fill="#0284C7"/>
      <path d="M22 -34 26 -39 38 8 32 -3Z" fill="#7DD3FC"/>

      <!-- 右耳：向右舒展，与左耳形成不对称 -->
      <path
        d="M64 37 77 -25 101 -44 111 -29 87 37Z"
        fill="#171B22"
      />
      <path
        d="M72 33 84 -20 99 -33 102 -27 81 33Z"
        fill="#38BDF8"
      />
      <path d="M99 -33 102 -27 81 33H76L91 -15Z" fill="#0284C7"/>
      <path d="M84 -20 99 -33 91 -15 79 5Z" fill="#7DD3FC"/>

      <!-- 杯把：镂空的多边形结构 -->
      <path
        fill-rule="evenodd"
        d="M109 42H139L153 56V78L136 96H111V82H129L139 72V62L132 55H109Z"
        fill="#171B22"
      />
      <path d="M139 42 153 56V78L139 72V62L132 55Z" fill="#B98256"/>
      <path d="M153 78 136 96H111L129 82 139 72Z" fill="#70452F"/>

      <!-- 杯身 -->
      <path
        d="M0 35H122L112 99 96 115H27L11 99Z"
        fill="#171B22"
      />

      <!-- 杯口与咖啡液面 -->
      <path d="M9 40H113L109 53H13Z" fill="#D9AB7E"/>
      <path d="M17 44H105L103 49H19Z" fill="#70452F"/>

      <!-- 杯身的奶咖色纸面 -->
      <path
        d="M14 59H108L102 94 91 105H32L21 94Z"
        fill="#E8C9A5"
      />
      <path d="M14 59H36L32 105 21 94Z" fill="#B98256"/>
      <path d="M86 59H108L102 94 91 105H76Z" fill="#D9AB7E"/>

      <!-- 兔脸：短切口眼睛与三角形鼻子 -->
      <path d="M42 73 47 71V78L42 80Z" fill="#171B22"/>
      <path d="M76 71 81 73V80L76 78Z" fill="#171B22"/>
      <path d="M56 82H67L61.5 88Z" fill="#70452F"/>
      <path
        d="M61.5 88V92L55 96M61.5 92 68 96"
        stroke="#70452F"
        stroke-width="2"
        stroke-linecap="square"
        stroke-linejoin="miter"
      />

      <!-- 右下角的蓝色翻折 -->
      <path d="M91 105 102 94 105 78 76 105Z" fill="#38BDF8"/>
      <path d="M91 105 102 94 76 105Z" fill="#0284C7"/>

      <!-- 折纸杯碟 -->
      <path d="M-10 122H139L121 132H9Z" fill="#171B22"/>
      <path d="M-10 122H139L112 126H14Z" fill="#38BDF8"/>
      <path d="M14 126H112L121 132H9Z" fill="#0284C7"/>
    </g>
  </g>
</svg>