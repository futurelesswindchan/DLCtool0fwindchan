<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
  <!-- 角落纹样：兔耳（宪法 7.3 辨识度担当）。
       只画耳不画头 — 落选项警示写实轮廓易像别的动物。
       两耳下端收窄、外缘饱满内缘较直，读作一对而非平行物。
       供 Ornament corner 角色，被负偏移裁掉约四分之一后露出耳尖。 -->
  <!-- 左耳 -->
  <path d="M30 78 C22 66 20 46 26 32 C29 25 34 22 38 26 C43 31 44 52 41 66 C39.5 73 36 78 33 79 Z"/>
  <!-- 右耳：略拢向左，不对称才不呆板 -->
  <path d="M62 76 C56 64 55 44 60 31 C63 24 68 22 71 27 C75 33 74 53 70 65 C68 71 65 76 63 77 Z"/>
</svg>
